name: Fix payroll history constraint
on:
  workflow_dispatch:
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Drop unique(month,name) on payroll_history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request
          TOKEN = os.environ["SUPABASE_ACCESS_TOKEN"]
          REF = "wdbkdwhtocbdaufxufqs"
          sql = """
          alter table public.payroll_history drop constraint if exists payroll_history_month_name_key;
          """
          req = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{REF}/database/query",
              data=json.dumps({"query": sql}).encode(),
              headers={"Authorization": f"Bearer {TOKEN}", "Content-Type": "application/json"},
              method="POST")
          with urllib.request.urlopen(req, timeout=120) as r:
              print(r.read().decode()[:500])
          print("PAYROLL_HISTORY_FIX_DONE")
          PYEOF
