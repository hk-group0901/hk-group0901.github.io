name: Setup staff profile columns
on:
  workflow_dispatch:
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Add hire_date and profile_note to staff
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request
          TOKEN = os.environ["SUPABASE_ACCESS_TOKEN"]
          REF = "wdbkdwhtocbdaufxufqs"
          sql = """
          alter table public.staff add column if not exists hire_date date;
          alter table public.staff add column if not exists profile_note text;
          """
          req = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{REF}/database/query",
              data=json.dumps({"query": sql}).encode(),
              headers={"Authorization": f"Bearer {TOKEN}", "Content-Type": "application/json"},
              method="POST")
          with urllib.request.urlopen(req, timeout=120) as r:
              print(r.read().decode()[:500])
          print("STAFF_PROFILE_SETUP_DONE")
          PYEOF
